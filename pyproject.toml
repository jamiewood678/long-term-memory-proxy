[project]
name = "numen-proxy"
version = "0.1.0"
description = "Transparent proxy between Numen and llama-server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "basedpyright>=1.19",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/numen_proxy"]

# --- Linting / formatting (Pint + ESLint equivalent) ---
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting (isort, built in)
    "UP",  # pyupgrade — flags old-style syntax
    "B",   # flake8-bugbear — likely-bug patterns
    "SIM", # flake8-simplify
    "N",   # pep8-naming
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI pattern relies on calling Depends()/Query()/Body() as an
# argument default — that's correct here, not the bug B008 usually catches.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path"]

# --- Static typing (PHPStan equivalent) ---
[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# FastAPI's DI pattern calls Depends()/Query()/etc. as an argument default —
# that's correct here, not the footgun this rule usually catches.
reportCallInDefaultInitializer = false

# --- Tests (PHPUnit/Pest/Jest/Vitest equivalent) ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, isolated tests with no I/O",
    "integration: in-process component tests (real app object, stub collaborators)",
    "e2e: full-process tests over a real socket",
]

# --- Coverage (PCOV/Istanbul equivalent) ---
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
